<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Benchy gallery</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; color: #222; }
    h1 { font-size: 1.25rem; font-weight: 600; }
    .card { border: 1px solid #ccc; padding: 1rem; margin-top: 1.5rem; }
    .photo { width: 100%; aspect-ratio: 1; background: #c4a574; margin-bottom: 0.75rem; }
    .title { font-weight: 600; margin: 0 0 0.25rem; }
    .note { margin: 0; color: #444; font-size: 0.95rem; }
  </style>
</head>
<body>
  <h1>Benchy gallery</h1>
  <p>Hello-world scaffold. One fake card.</p>
  <article class="card">
    <div class="photo" aria-hidden="true"></div>
    <p class="title">Chef pen holder</p>
    <p class="note">Gift for Gelli — first wall-label test.</p>
  </article>
</body>
</html>
